<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.5 -apple-system, sans-serif; width: 320px; padding: 12px 14px; margin: 0; color: #1f2328; }
      h1 { font-size: 13px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
      h1 img { width: 16px; height: 16px; }
      h2 { font-size: 12px; color: #59636e; font-weight: 600; margin: 12px 0 4px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      .on { background: #2ea043; }
      .off { background: #cf222e; }
      .card { border: 1px solid #d0d7de; border-radius: 6px; padding: 6px 8px; margin: 4px 0; }
      .pending { border-color: #d4790b; background: #fff8ed; }
      .meta { color: #59636e; font-size: 12px; word-break: break-all; }
      .row { display: flex; gap: 6px; margin-top: 6px; }
      input { flex: 1; font: 15px ui-monospace, monospace; letter-spacing: 1px; padding: 4px 6px; text-transform: uppercase; border: 1px solid #d0d7de; border-radius: 4px; }
      button { font: inherit; padding: 3px 10px; border-radius: 4px; border: 1px solid #d0d7de; background: #f6f8fa; cursor: pointer; }
      button.primary { background: #1f3a60; color: #fff; border-color: #1f3a60; }
      button.link { border: none; background: none; color: #cf222e; padding: 0; font-size: 12px; }
      .msg { font-size: 12px; margin-top: 4px; min-height: 16px; }
      .err { color: #cf222e; }
      .ok { color: #1a7f37; }
      .hint { color: #59636e; font-size: 12px; margin-top: 10px; }
      code { background: #f3f3f3; padding: 1px 4px; border-radius: 3px; }
      .agent { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .controls { display: flex; gap: 6px; margin-top: 10px; }
      .controls button { flex: 1; }
      button.danger { background: #fff1f0; color: #b42318; border-color: #f3b2ad; }
      button.active { background: #b42318; color: #fff; border-color: #b42318; }
      button.paused { background: #59636e; color: #fff; border-color: #59636e; }
      textarea { width: 100%; box-sizing: border-box; font: 12px ui-monospace, monospace; border: 1px solid #d0d7de; border-radius: 4px; padding: 4px 6px; resize: vertical; }
      details summary { cursor: pointer; font-size: 12px; color: #59636e; font-weight: 600; margin-top: 12px; }
      .log { max-height: 180px; overflow-y: auto; }
      .log div { font-size: 11px; border-bottom: 1px solid #eee; padding: 2px 0; word-break: break-all; }
      .log .denied { color: #b42318; }
      .log .error { color: #9a6700; }
      .log time { color: #8c959f; margin-right: 4px; }
    </style>
  </head>
  <body>
    <h1><img src="icon48.png" alt="" />Chrome Bridge</h1>
    <div><span id="dot" class="dot off"></span><span id="state">检查中…</span></div>

    <div class="controls">
      <button id="pauseBtn" title="立即停止所有 agent 操作, 并放开所有被调试的标签">暂停全部</button>
      <button id="fullBtn" class="danger" title="允许读取 cookie、历史、浏览数据等敏感操作, 到时自动关闭">开启完全模式</button>
    </div>
    <div id="modeMsg" class="msg"></div>

    <section id="pairBox" hidden>
      <h2>待配对</h2>
      <div id="pendingList"></div>
      <div class="row">
        <input id="code" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" spellcheck="false" />
        <button id="pairBtn" class="primary">配对</button>
      </div>
      <div id="pairMsg" class="msg"></div>
    </section>

    <section id="sessionBox" hidden>
      <h2>已接入的会话</h2>
      <div id="sessionList"></div>
    </section>

    <section id="agentBox" hidden>
      <h2>已配对的 agent</h2>
      <div id="agentList"></div>
    </section>

    <details id="sitesBox">
      <summary>禁止站点</summary>
      <div class="meta">每行一个域名, agent 不能打开或操作这些网站 (含子域)。例: <code>chase.com</code>、<code>*.bank.com</code></div>
      <textarea id="sites" rows="4" spellcheck="false" placeholder="chase.com&#10;paypal.com"></textarea>
      <div class="row"><button id="sitesBtn">保存</button><span id="sitesMsg" class="msg"></span></div>
    </details>

    <details id="logBox">
      <summary>操作日志</summary>
      <div id="log" class="log"></div>
    </details>

    <div class="hint" id="hint"></div>
    <script src="popup.js"></script>
  </body>
</html>
